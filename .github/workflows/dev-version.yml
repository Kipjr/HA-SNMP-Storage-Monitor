name: Dev Version

on:
  pull_request:
    branches: [dev]
    types: [closed]

permissions:
  contents: write

jobs:
  tag-dev:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Create dev tag and update manifest
        shell: bash
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          matches=0
          label=""
          for candidate in major minor patch; do
            if [[ ",$LABELS," == *",version:$candidate,"* ]]; then label="$candidate"; matches=$((matches+1)); fi
          done
          if [[ "$matches" != "1" ]]; then echo "Merged PR must have exactly one version label."; exit 1; fi
          git fetch --tags
          latest="0.0.0"
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then latest="$tag"; break; fi
          done < <(git tag --list --sort=-v:refname)
          IFS=. read -r major minor patch <<< "$latest"
          case "$label" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          target="$major.$minor.$patch"
          tag="$target-dev.${GITHUB_RUN_NUMBER}"
          manifest="custom_components/snmp_storage_monitor/manifest.json"
          python - "$manifest" "$tag" <<'PY'
          import json,sys
          path,version=sys.argv[1:]
          with open(path,encoding="utf-8") as f: data=json.load(f)
          data["version"]=version
          with open(path,"w",encoding="utf-8") as f: json.dump(data,f,indent=2); f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$manifest"
          if ! git diff --cached --quiet; then
            git commit -m "chore: update dev version to $tag"
            git push origin dev
          fi
          git tag "$tag" "$(git rev-parse HEAD)"
          git push origin "$tag"
          echo "Created $tag"
