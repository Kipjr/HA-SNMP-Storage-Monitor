name: Stable Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update manifest, tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags
          dev_tag="$(git tag --list '*-dev.*' --sort=-v:refname | head -n1)"
          if [[ -z "$dev_tag" ]]; then
            echo "No dev version tag found. Cannot infer release version."
            exit 1
          fi
          version="${dev_tag%%-dev.*}"
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "Stable tag $version already exists; exiting."
            exit 0
          fi
          manifest="custom_components/snmp_storage_monitor/manifest.json"
          python - "$manifest" "$version" <<'PY'
          import json,sys
          path,version=sys.argv[1:]
          with open(path,encoding="utf-8") as f: data=json.load(f)
          data["version"]=version
          with open(path,"w",encoding="utf-8") as f: json.dump(data,f,indent=2); f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$manifest"
          if ! git diff --cached --quiet; then
            git commit -m "chore: release version $version"
            git push origin master
          fi
          git tag "$version" "$(git rev-parse HEAD)"
          git push origin "$version"
          gh release create "$version" --title "$version" --generate-notes --target "$(git rev-parse HEAD)"
