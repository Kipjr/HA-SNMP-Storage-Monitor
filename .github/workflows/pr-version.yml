name: PR Version Preview

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: read

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Generate beta tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          label=""
          for candidate in major minor patch; do
            if [[ ",$LABELS," == *",version:$candidate,"* ]]; then label="$candidate"; fi
          done
          if [[ -z "$label" ]]; then
            echo "Missing required label: version:major, version:minor or version:patch"
            exit 1
          fi
          git fetch --tags
          latest="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          latest="${latest:-0.0.0}"
          IFS=. read -r major minor patch <<< "$latest"
          case "$label" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          version="$major.$minor.$patch-beta.$PR_COMMITS"
          echo "Preview version: $version"
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "Tag already exists: $version"
          else
            git tag "$version" "${{ github.event.pull_request.head.sha }}"
            git push origin "$version"
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --body "Beta version preview: `$version`" || gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Beta version preview: `$version"
