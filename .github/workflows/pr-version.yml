name: PR Version Preview

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Create beta tag
        shell: bash
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          matches=0
          label=""
          for candidate in major minor patch; do
            if [[ ",$LABELS," == *",version:$candidate,"* ]]; then label="$candidate"; matches=$((matches+1)); fi
          done
          if [[ "$matches" != "1" ]]; then echo "Set exactly one version label (version:major/minor/patch)."; exit 1; fi
          git fetch --tags
          latest="0.0.0"
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then latest="$tag"; break; fi
          done < <(git tag --list --sort=-v:refname)
          IFS=. read -r major minor patch <<< "$latest"
          case "$label" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          version="$major.$minor.$patch-beta.$PR_COMMITS"
          if ! git rev-parse "$version" >/dev/null 2>&1; then
            git tag "$version" "$PR_SHA"
            git push origin "$version"
          fi
          echo "Beta tag: $version"
