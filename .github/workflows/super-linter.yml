name: Lint Code Base

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev", "master"]

permissions:
  contents: read

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Super-linter
        uses: super-linter/super-linter@v9.0.0
        env:
          DEFAULT_BRANCH: dev
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_YAML: true
          VALIDATE_YAML_PRETTIER: true
          VALIDATE_JSON: true
          VALIDATE_JSON_PRETTIER: true
          VALIDATE_PYTHON: true
          VALIDATE_PYTHON_PYLINT: true
